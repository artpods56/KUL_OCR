[project]
name = "core"
version = "0.1.0"
description = "Core domain, services, and adapters for OCR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.5",
    "celery>=5.5.3",
    "celery-stubs>=0.1.3",
    "celery-types>=0.23.0",
    "dotenv>=0.9.9",
    "filetype>=1.2.0",
    "msgspec>=0.19.0",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.26.6",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0.44",
    "structlog>=25.5.0",
    "ty>=0.0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
pytest-beartype = { git = "https://github.com/beartype/pytest-beartype", branch = "main" }
