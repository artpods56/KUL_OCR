dependencies = ["core", "backend"]

[tool.uv.workspace]
members = [
    "libs/core",
    "apps/backend",
]

[dependency-groups]
dev = [
    "basedpyright>=1.33.0",
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "pre-commit>=4.5.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-beartype",
    "pytest-celery>=1.2.1",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "ruff>=0.14.6",
    "ty>=0.0.13",
]


[tool.uv.sources]
core = { workspace = true }
backend = { workspace = true }
pytest-beartype = { git = "https://github.com/beartype/pytest-beartype", branch = "main" }
